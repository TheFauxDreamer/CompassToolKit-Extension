<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Compass Toolkit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <img class="app-icon" src="icons/icon48.png" alt="" />
      <div class="app-title">
        <h1>Compass Toolkit</h1>
        <p class="app-sub" id="summary">Loading…</p>
      </div>
    </header>

    <main class="features" id="features"></main>

    <footer class="app-footer">
      <label class="footer-option">
        <span class="switch small">
          <input type="checkbox" id="colourToggle" />
          <span class="slider"></span>
        </span>
        <span class="footer-option-label">Colour code</span>
      </label>
      <div class="footer-end">
        <span class="version" id="version"></span>
        <button type="button" class="link-btn" id="resetBtn">
          Reset to defaults
        </button>
      </div>
    </footer>

    <script src="src/shared/settings.js"></script>
    <script src="src/shared/icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
